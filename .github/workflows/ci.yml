name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore XbfKit.slnx

      - name: Build
        run: dotnet build XbfKit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project XbfKit.Tests/XbfKit.Tests.csproj --configuration Release --no-restore
