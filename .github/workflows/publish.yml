name: Publish NuGet package

on:
  workflow_dispatch:

env:
  WORKING_DIR:         '${{ github.workspace }}' # 'D:\a\XbfKit\XbfKit'
  OUTPUT_DIR:          '${{ github.workspace }}\artifacts'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-2025-vs2026
    env:
      CONFIGURATION: 'Release'
      PLATFORM: 'x64'
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Pack
        run: dotnet pack XbfKit/XbfKit.csproj -c $env:CONFIGURATION -a $env:PLATFORM -o $env:OUTPUT_DIR

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ${{ env.OUTPUT_DIR }}\*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ${{ env.OUTPUT_DIR }}\*.snupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
