name: Publish NuGet package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - name: Resolve package version and source timestamp
        id: release
        shell: pwsh
        run: |
          $project = dotnet msbuild XbfKit/XbfKit.csproj -getProperty:PackageVersion -getProperty:Version | ConvertFrom-Json
          $version = $project.Properties.PackageVersion
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "PackageVersion '$version' is not a valid MAJOR.MINOR.PATCH version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "timestamp=$(git show -s --format=%ct HEAD)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore XbfKit.slnx

      - name: Build
        run: dotnet build XbfKit.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:DeterministicTimestamp=${{ steps.release.outputs.timestamp }} -p:RepositoryCommit=${{ github.sha }}

      - name: Test
        run: dotnet test --project XbfKit.Tests/XbfKit.Tests.csproj --configuration Release --no-build --no-restore

      - name: Pack
        run: dotnet pack XbfKit/XbfKit.csproj --configuration Release --no-build --no-restore --output artifacts -p:PackageVersion=${{ steps.release.outputs.version }} -p:ContinuousIntegrationBuild=true -p:DeterministicTimestamp=${{ steps.release.outputs.timestamp }} -p:RepositoryCommit=${{ github.sha }}

      # NuGet/login exchanges this job's GitHub OIDC token for a short-lived
      # NuGet API key. Configure the matching policy on nuget.org first.
      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          OUTPUT_DIR: artifacts
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ${{ env.OUTPUT_DIR }}\*.nupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push ${{ env.OUTPUT_DIR }}\*.snupkg --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
